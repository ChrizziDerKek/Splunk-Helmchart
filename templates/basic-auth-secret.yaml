{{- if and (eq .Values.mode "enterprise") .Values.enterprise.basicAuth.enabled .Values.enterprise.basicAuth.createSecret }}
{{- $cfg := .Values.enterprise.basicAuth -}}
{{- $name := $cfg.secretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := $cfg.password -}}
{{- if not $password -}}
  {{- if and $existing (hasKey $existing.data "BASIC_AUTH_PASSWORD") -}}
    {{- $password = (index $existing.data "BASIC_AUTH_PASSWORD" | b64dec) -}}
  {{- else -}}
    {{- $password = randAlphaNum 32 -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "splunk.labels" . | nindent 4 }}
  {{- if $cfg.keepSecretOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  BASIC_AUTH_USERNAME: {{ $cfg.username | quote }}
  BASIC_AUTH_PASSWORD: {{ $password | quote }}
  users: {{ htpasswd $cfg.username $password | quote }}
{{- end }}
