{{- if .Values.auth.createSecret }}
{{- $name := .Values.auth.secretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := .Values.auth.password -}}
{{- if not $password -}}
  {{- if and $existing (hasKey $existing.data "SPLUNK_PASSWORD") -}}
    {{- $password = (index $existing.data "SPLUNK_PASSWORD" | b64dec) -}}
  {{- else -}}
    {{- $password = randAlphaNum 32 -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "splunk.labels" . | nindent 4 }}
  {{- if .Values.auth.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  SPLUNK_PASSWORD: {{ $password | quote }}
{{- end }}
